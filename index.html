<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZapOrçamento - Orçamentos e Recibos Rápidos</title>

    <!-- Configurações PWA (Instalação no Celular) -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#090d16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZapOrçamento" />

    <style>
      :root {
        --primary: #059669;
        --primary-hover: #047857;
        --bg: #090d16;
        --card: #131b2e;
        --border: #24324d;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --accent: #38bdf8;
        --success: #10b981;
        --danger: #ef4444;
        --warning: #f59e0b;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      body {
        background-color: var(--bg);
        color: var(--text);
        padding: 16px 12px 40px 12px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
      }

      .container {
        width: 100%;
        max-width: 620px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      header {
        text-align: center;
        margin-bottom: 4px;
      }

      header h1 {
        font-size: 26px;
        color: #34d399;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      header p {
        font-size: 14px;
        color: var(--text-muted);
        margin-top: 4px;
      }

      .marca-dagua-app {
        font-size: 11px;
        color: #475569;
        text-align: center;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        font-weight: 700;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        width: 100%;
        overflow: hidden;
      }

      .card h2 {
        font-size: 15px;
        font-weight: 700;
        color: var(--accent);
        border-bottom: 1px solid var(--border);
        padding-bottom: 8px;
        letter-spacing: 0.3px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .campo {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 100%;
      }

      label {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
      }

      input, select, textarea {
        background: #090d16;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        color: #fff;
        font-size: 15px;
        outline: none;
        width: 100%;
        min-width: 0;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      input:focus, select:focus, textarea:focus {
        border-color: #34d399;
      }

      input.valido {
        border-color: var(--success) !important;
        box-shadow: 0 0 8px rgba(16, 185, 129, 0.2);
      }

      input.invalido {
        border-color: var(--danger) !important;
        box-shadow: 0 0 8px rgba(239, 68, 68, 0.3);
      }

      input.atencao {
        border-color: var(--warning) !important;
      }

      .msg-validacao {
        font-size: 12px;
        font-weight: 600;
        margin-top: 2px;
        display: none;
      }

      .linha-dupla {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        width: 100%;
      }

      /* Upload e Pré-visualização do Logotipo */
      .logo-upload-box {
        display: flex;
        align-items: center;
        gap: 12px;
        background: #090d16;
        padding: 10px;
        border-radius: 8px;
        border: 1px dashed var(--border);
      }

      .logo-preview-img {
        width: 50px;
        height: 50px;
        object-fit: contain;
        background: #1e293b;
        border-radius: 6px;
        border: 1px solid var(--border);
        display: none;
      }

      .btn-del-logo {
        background: #ef4444;
        color: #fff;
        border: none;
        padding: 6px 10px;
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
        display: none;
      }

      /* Itens de Serviço */
      .item-linha {
        display: grid;
        grid-template-columns: minmax(0, 1.8fr) minmax(0, 1.1fr) 42px;
        gap: 8px;
        align-items: center;
        width: 100%;
        margin-bottom: 8px;
      }

      .item-linha input {
        min-width: 0;
      }

      .btn-remover {
        background: #ef4444;
        color: white;
        border: none;
        border-radius: 8px;
        width: 100%;
        height: 44px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
      }

      .btn-adicionar {
        background: #1e293b;
        color: var(--accent);
        border: 1px dashed var(--accent);
        border-radius: 8px;
        padding: 11px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        transition: 0.2s;
      }

      .total-box {
        background: #090d16;
        padding: 14px 16px;
        border-radius: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 18px;
        font-weight: bold;
        color: #34d399;
        border: 1px solid #059669;
      }

      /* Assistente de Cláusulas */
      .assistente-box {
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: #0c1220;
        border: 1px dashed #38bdf8;
        border-radius: 10px;
        padding: 12px;
      }

      .chips-container {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .chip-btn {
        background: #1e293b;
        border: 1px solid #334155;
        color: #e2e8f0;
        padding: 6px 10px;
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
        transition: 0.15s;
      }

      .chip-btn:hover {
        border-color: #38bdf8;
        color: #38bdf8;
      }

      /* Ações principais */
      .acoes {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .btn-whats {
        background: #25d366;
        color: #0b141a;
        border: none;
        padding: 15px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 10px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: 0.2s;
      }

      .btn-whats:hover {
        background: #20ba5a;
      }

      .btn-pdf {
        background: var(--accent);
        color: #0f172a;
        border: none;
        padding: 13px;
        font-size: 15px;
        font-weight: bold;
        border-radius: 10px;
        cursor: pointer;
      }

      /* Histórico */
      .historico-lista {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-height: 280px;
        overflow-y: auto;
      }

      .historico-item {
        background: #090d16;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }

      .historico-info {
        font-size: 13px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .historico-acoes {
        display: flex;
        gap: 6px;
      }

      .btn-hist {
        padding: 6px 10px;
        border-radius: 6px;
        border: none;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }

      .btn-hist-load {
        background: #38bdf8;
        color: #090d16;
      }

      .btn-hist-del {
        background: #ef4444;
        color: #fff;
      }

      @media (max-width: 380px) {
        .linha-dupla {
          grid-template-columns: 1fr;
        }
        .item-linha {
          grid-template-columns: 1.6fr 1fr 38px;
          gap: 6px;
        }
      }

      /* Folha PDF com Marca d'água Lodysteelbr */
      @media print {
        body {
          background: white !important;
          color: black !important;
          padding: 0;
        }
        .container {
          max-width: 100%;
        }
        header, .card, .acoes, .btn-adicionar, .btn-remover, .assistente-box, .marca-dagua-app {
          display: none !important;
        }
        #folhaImpressao {
          display: block !important;
          color: black;
          padding: 30px;
          position: relative;
          min-height: 90vh;
        }
        .marca-dagua-impressao {
          position: fixed;
          top: 48%;
          left: 50%;
          transform: translate(-50%, -50%) rotate(-32deg);
          font-size: 72px;
          font-weight: 900;
          color: rgba(0, 0, 0, 0.06);
          letter-spacing: 8px;
          text-transform: uppercase;
          pointer-events: none;
          z-index: 0;
          white-space: nowrap;
        }
      }

      #folhaImpressao {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>⚡ ZapOrçamento</h1>
        <p>Crie orçamentos e recibos profissionais em segundos</p>
      </header>

      <!-- 1. Dados do Prestador -->
      <div class="card">
        <h2>1. Meus Dados (Salvos no aparelho)</h2>
        
        <!-- Logotipo do Negócio -->
        <div class="campo">
          <label>Logotipo do Negócio (Opcional - Sai no PDF)</label>
          <div class="logo-upload-box">
            <img id="logoPreview" class="logo-preview-img" alt="Logo" />
            <div style="flex: 1;">
              <input type="file" id="inputLogo" accept="image/*" onchange="salvarLogo(event)" style="padding: 6px; font-size: 13px;" />
            </div>
            <button type="button" id="btnRemoverLogo" class="btn-del-logo" onclick="removerLogo()">Remover</button>
          </div>
        </div>

        <div class="campo">
          <label>Seu Nome ou Nome do Negócio</label>
          <input type="text" id="meuNome" placeholder="Ex: Silva Manutenções" onchange="salvarMeusDados()" />
        </div>

        <div class="linha-dupla">
          <div class="campo">
            <label>Tipo de Chave PIX</label>
            <select id="tipoPix" onchange="aoMudarTipoPix()">
              <option value="cpf">CPF</option>
              <option value="telefone">Celular</option>
              <option value="email">E-mail</option>
              <option value="aleatoria">Chave Aleatória</option>
            </select>
          </div>
          <div class="campo">
            <label>Tipo de Documento</label>
            <select id="tipoDoc">
              <option value="ORÇAMENTO">Orçamento</option>
              <option value="RECIBO DE PAGAMENTO">Recibo</option>
            </select>
          </div>
        </div>

        <div class="campo">
          <label>Chave PIX</label>
          <input 
            type="text" 
            id="minhaPix" 
            placeholder="Digite os 11 números do CPF" 
            oninput="validarCampoPix()" 
            onchange="salvarMeusDados()" 
          />
          <small id="statusPix" class="msg-validacao"></small>
        </div>
      </div>

      <!-- 2. Dados do Cliente -->
      <div class="card">
        <h2>2. Dados do Cliente</h2>
        <div class="linha-dupla">
          <div class="campo">
            <label>Nome do Cliente</label>
            <input type="text" id="clienteNome" placeholder="Ex: Roberto Carlos" />
          </div>
          <div class="campo">
            <label>WhatsApp (com DDD)</label>
            <input type="tel" id="clienteWhats" placeholder="Ex: 11999998888" />
          </div>
        </div>
      </div>

      <!-- 3. Serviços ou Produtos -->
      <div class="card">
        <h2>3. Serviços ou Produtos</h2>
        <div id="listaItens">
          <div class="item-linha">
            <input type="text" class="item-desc" placeholder="Descrição do serviço" />
            <input type="number" class="item-valor" placeholder="R$ 0,00" oninput="atualizarTotal()" />
            <button class="btn-remover" onclick="removerItem(this)">✕</button>
          </div>
        </div>
        <button class="btn-adicionar" onclick="adicionarItem()">+ Adicionar outro serviço</button>

        <div class="total-box">
          <span>Total Geral:</span>
          <span id="valorTotal">R$ 0,00</span>
        </div>
      </div>

      <!-- 4. Observações / Assistente -->
      <div class="card">
        <h2>4. Condições e Termos</h2>
        <div class="assistente-box">
          <div class="chips-container">
            <button class="chip-btn" onclick="inserirClausula('padrao')">📅 Padrão (50% entrada / 50% entrega)</button>
            <button class="chip-btn" onclick="inserirClausula('garantia')">🛡️ Garantia de 90 Dias</button>
            <button class="chip-btn" onclick="inserirClausula('materiais')">📦 Materiais à parte</button>
            <button class="chip-btn" onclick="inserirClausula('desconto')">💰 5% desconto à vista</button>
            <button class="chip-btn" onclick="inserirClausula('completo')" style="border-color: #34d399; color: #34d399;">🤖 Proposta Completa</button>
          </div>
        </div>

        <div class="campo">
          <textarea id="observacoes" rows="3" placeholder="Clique num botão acima ou digite as condições..."></textarea>
        </div>
      </div>

      <!-- Ações -->
      <div class="acoes">
        <button class="btn-whats" onclick="enviarWhatsApp()">
          📲 Enviar Proposta pelo WhatsApp
        </button>
        <button class="btn-pdf" onclick="imprimirPDF()">
          📄 Salvar em PDF / Imprimir
        </button>
      </div>

      <!-- 5. Histórico -->
      <div class="card">
        <h2>
          <span>📜 Histórico de Propostas</span>
          <button onclick="limparTodoHistorico()" style="background:none; border:none; color:#ef4444; font-size:12px; cursor:pointer;">Limpar Tudo</button>
        </h2>
        <div id="listaHistorico" class="historico-lista">
          <p style="font-size:13px; color:#64748b; text-align:center; padding:10px;">Nenhum orçamento emitido ainda.</p>
        </div>
      </div>

      <div class="marca-dagua-app">Desenvolvido com tecnologia • Lodysteelbr</div>

      <div id="folhaImpressao"></div>
    </div>

    <script>
      // Service Worker (PWA)
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js").catch((err) => {
            console.log("Service Worker:", err);
          });
        });
      }

      // Sistema de Áudio Web
      let audioCtx = null;
      function getAudioContext() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function somConfirmacao() {
        try {
          const ctx = getAudioContext();
          const now = ctx.currentTime;
          const osc1 = ctx.createOscillator();
          const gain1 = ctx.createGain();
          osc1.type = "sine";
          osc1.frequency.setValueAtTime(659.25, now);
          gain1.gain.setValueAtTime(0.15, now);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc1.connect(gain1);
          gain1.connect(ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.15);

          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.type = "sine";
          osc2.frequency.setValueAtTime(880, now + 0.1);
          gain2.gain.setValueAtTime(0.18, now + 0.1);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.start(now + 0.1);
          osc2.stop(now + 0.35);
        } catch (e) {}
      }

      function somErro() {
        try {
          const ctx = getAudioContext();
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.linearRampToValueAtTime(120, now + 0.22);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.22);
        } catch (e) {}
      }

      // Validação Oficial de CPF
      function testarValidadeCPF(strCPF) {
        let cpf = strCPF.replace(/\D/g, "");
        if (cpf.length !== 11) return false;
        if (/^(\d)\1{10}$/.test(cpf)) return false;

        let soma = 0;
        for (let i = 0; i < 9; i++) soma += parseInt(cpf.charAt(i)) * (10 - i);
        let resto = 11 - (soma % 11);
        let dig1 = (resto === 10 || resto === 11) ? 0 : resto;
        if (dig1 !== parseInt(cpf.charAt(9))) return false;

        soma = 0;
        for (let i = 0; i < 10; i++) soma += parseInt(cpf.charAt(i)) * (11 - i);
        resto = 11 - (soma % 11);
        let dig2 = (resto === 10 || resto === 11) ? 0 : resto;
        if (dig2 !== parseInt(cpf.charAt(10))) return false;

        return true;
      }

      function formatarMascaraCPF(v) {
        v = v.replace(/\D/g, "").slice(0, 11);
        if (v.length > 9) return v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, "$1.$2.$3-$4");
        if (v.length > 6) return v.replace(/(\d{3})(\d{3})(\d{1,3})/, "$1.$2.$3");
        if (v.length > 3) return v.replace(/(\d{3})(\d{1,3})/, "$1.$2");
        return v;
      }

      function validarCampoPix() {
        const tipo = document.getElementById("tipoPix").value;
        const input = document.getElementById("minhaPix");
        const status = document.getElementById("statusPix");

        input.classList.remove("valido", "invalido", "atencao");
        status.style.display = "none";

        if (!input.value.trim()) return true;

        if (tipo === "cpf") {
          input.value = formatarMascaraCPF(input.value);
          const nums = input.value.replace(/\D/g, "");

          if (nums.length === 11) {
            if (testarValidadeCPF(nums)) {
              input.classList.add("valido");
              status.innerText = "✅ CPF válido";
              status.style.color = "var(--success)";
              status.style.display = "block";
              return true;
            } else {
              input.classList.add("invalido");
              status.innerText = "❌ CPF inválido! Verifique os números.";
              status.style.color = "var(--danger)";
              status.style.display = "block";
              return false;
            }
          } else {
            input.classList.add("atencao");
            status.innerText = `⏳ Digitando CPF... (${nums.length}/11)`;
            status.style.color = "var(--warning)";
            status.style.display = "block";
            return false;
          }
        }
        return true;
      }

      function aoMudarTipoPix() {
        const tipo = document.getElementById("tipoPix").value;
        const input = document.getElementById("minhaPix");
        input.value = "";
        input.classList.remove("valido", "invalido", "atencao");
        document.getElementById("statusPix").style.display = "none";

        if (tipo === "cpf") input.placeholder = "000.000.000-00";
        else if (tipo === "telefone") input.placeholder = "(11) 99999-9999";
        else if (tipo === "email") input.placeholder = "seuemail@exemplo.com";
        else input.placeholder = "Cole a chave aleatória";

        salvarMeusDados();
      }

      // Suporte ao Logotipo
      function salvarLogo(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (evt) {
          const base64 = evt.target.result;
          localStorage.setItem("prestador_logo", base64);
          atualizarVisualizacaoLogo(base64);
        };
        reader.readAsDataURL(file);
      }

      function removerLogo() {
        localStorage.removeItem("prestador_logo");
        document.getElementById("inputLogo").value = "";
        atualizarVisualizacaoLogo(null);
      }

      function atualizarVisualizacaoLogo(base64) {
        const img = document.getElementById("logoPreview");
        const btnDel = document.getElementById("btnRemoverLogo");
        if (base64) {
          img.src = base64;
          img.style.display = "block";
          btnDel.style.display = "block";
        } else {
          img.style.display = "none";
          btnDel.style.display = "none";
        }
      }

      // Persistência Inicial
      window.onload = function () {
        const nomeSalvo = localStorage.getItem("prestador_nome");
        const pixSalva = localStorage.getItem("prestador_pix");
        const tipoPixSalvo = localStorage.getItem("prestador_tipo_pix");
        const logoSalvo = localStorage.getItem("prestador_logo");

        if (nomeSalvo) document.getElementById("meuNome").value = nomeSalvo;
        if (tipoPixSalvo) document.getElementById("tipoPix").value = tipoPixSalvo;
        if (pixSalva) {
          document.getElementById("minhaPix").value = pixSalva;
          validarCampoPix();
        }
        if (logoSalvo) atualizarVisualizacaoLogo(logoSalvo);

        renderizarHistorico();
      };

      function salvarMeusDados() {
        localStorage.setItem("prestador_nome", document.getElementById("meuNome").value);
        localStorage.setItem("prestador_pix", document.getElementById("minhaPix").value);
        localStorage.setItem("prestador_tipo_pix", document.getElementById("tipoPix").value);
      }

      // Gestão de Itens
      function adicionarItem() {
        const lista = document.getElementById("listaItens");
        const div = document.createElement("div");
        div.className = "item-linha";
        div.innerHTML = `
          <input type="text" class="item-desc" placeholder="Descrição do serviço" />
          <input type="number" class="item-valor" placeholder="R$ 0,00" oninput="atualizarTotal()" />
          <button class="btn-remover" onclick="removerItem(this)">✕</button>
        `;
        lista.appendChild(div);
      }

      function removerItem(btn) {
        const itens = document.querySelectorAll(".item-linha");
        if (itens.length > 1) {
          btn.parentElement.remove();
          atualizarTotal();
        } else {
          somErro();
          alert("O documento precisa de pelo menos um serviço.");
        }
      }

      function calcularTotal() {
        const valores = document.querySelectorAll(".item-valor");
        let soma = 0;
        valores.forEach((input) => {
          const val = parseFloat(input.value);
          if (!isNaN(val)) soma += val;
        });
        return soma;
      }

      function atualizarTotal() {
        const total = calcularTotal();
        document.getElementById("valorTotal").innerText = total.toLocaleString("pt-BR", {
          style: "currency",
          currency: "BRL"
        });
      }

      function inserirClausula(tipo) {
        const campoObs = document.getElementById("observacoes");
        let textoAtual = campoObs.value.trim();

        const clausulas = {
          padrao: "Proposta válida por 7 dias. Pagamento: 50% de entrada e 50% na conclusão dos trabalhos.",
          garantia: "Garantia legal de 90 dias sobre a mão de obra prestada, mediante apresentação desta proposta.",
          materiais: "Valores referentes apenas à mão de obra. Materiais extras ficam por conta do cliente.",
          desconto: "Pagamento integral à vista no PIX conta com 5% de desconto promocional."
        };

        if (tipo === "completo") {
          const tipoDoc = document.getElementById("tipoDoc").value;
          if (tipoDoc === "RECIBO DE PAGAMENTO") {
            campoObs.value = "Declaro que o valor acima foi recebido e quitado integralmente. Garantia de 90 dias sobre os serviços executados.";
          } else {
            campoObs.value = "Validade da proposta: 7 dias corridos.\nCondições: 50% de entrada e 50% na entrega.\nGarantia de 90 dias sobre a mão de obra.\nMateriais necessários não inclusos.";
          }
          somConfirmacao();
          return;
        }

        if (textoAtual.length > 0) {
          campoObs.value = textoAtual + "\n" + clausulas[tipo];
        } else {
          campoObs.value = clausulas[tipo];
        }
        somConfirmacao();
      }

      // Histórico
      function salvarNoHistorico(dados) {
        let historico = JSON.parse(localStorage.getItem("zap_historico") || "[]");
        historico.unshift(dados);
        if (historico.length > 25) historico.pop();
        localStorage.setItem("zap_historico", JSON.stringify(historico));
        renderizarHistorico();
      }

      function renderizarHistorico() {
        const container = document.getElementById("listaHistorico");
        const historico = JSON.parse(localStorage.getItem("zap_historico") || "[]");

        if (historico.length === 0) {
          container.innerHTML = '<p style="font-size:13px; color:#64748b; text-align:center; padding:10px;">Nenhum orçamento emitido ainda.</p>';
          return;
        }

        container.innerHTML = "";
        historico.forEach((item, index) => {
          const div = document.createElement("div");
          div.className = "historico-item";
          div.innerHTML = `
            <div class="historico-info">
              <strong>${item.cliente} (${item.tipo})</strong>
              <span style="color:#34d399; font-weight:bold;">${item.total} • ${item.data}</span>
            </div>
            <div class="historico-acoes">
              <button class="btn-hist btn-hist-load" onclick="carregarDoHistorico(${index})">Abrir</button>
              <button class="btn-hist btn-hist-del" onclick="removerDoHistorico(${index})">✕</button>
            </div>
          `;
          container.appendChild(div);
        });
      }

      function carregarDoHistorico(index) {
        const historico = JSON.parse(localStorage.getItem("zap_historico") || "[]");
        const item = historico[index];
        if (!item) return;

        document.getElementById("clienteNome").value = item.cliente || "";
        document.getElementById("clienteWhats").value = item.whats || "";
        document.getElementById("tipoDoc").value = item.tipo || "ORÇAMENTO";
        document.getElementById("observacoes").value = item.obs || "";

        const lista = document.getElementById("listaItens");
        lista.innerHTML = "";
        item.itens.forEach((it) => {
          const div = document.createElement("div");
          div.className = "item-linha";
          div.innerHTML = `
            <input type="text" class="item-desc" value="${it.desc}" placeholder="Descrição do serviço" />
            <input type="number" class="item-valor" value="${it.valor}" placeholder="R$ 0,00" oninput="atualizarTotal()" />
            <button class="btn-remover" onclick="removerItem(this)">✕</button>
          `;
          lista.appendChild(div);
        });

        atualizarTotal();
        somConfirmacao();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function removerDoHistorico(index) {
        let historico = JSON.parse(localStorage.getItem("zap_historico") || "[]");
        historico.splice(index, 1);
        localStorage.setItem("zap_historico", JSON.stringify(historico));
        renderizarHistorico();
      }

      function limparTodoHistorico() {
        if (confirm("Deseja apagar todo o histórico de orçamentos?")) {
          localStorage.removeItem("zap_historico");
          renderizarHistorico();
        }
      }

      // Envio e PDF
      function coletarDadosFormulario() {
        const tipoPix = document.getElementById("tipoPix").value;
        const chavePix = document.getElementById("minhaPix").value.trim();

        if (tipoPix === "cpf" && chavePix.length > 0) {
          const cpfLimpo = chavePix.replace(/\D/g, "");
          if (cpfLimpo.length !== 11 || !testarValidadeCPF(cpfLimpo)) {
            somErro();
            document.getElementById("minhaPix").focus();
            alert("⚠️ Atenção: O CPF informado na Chave PIX é inválido. Corrija antes de prosseguir!");
            return null;
          }
        }

        const descs = document.querySelectorAll(".item-desc");
        const vals = document.querySelectorAll(".item-valor");
        let itensValidos = [];

        descs.forEach((d, i) => {
          const desc = d.value.trim();
          const val = parseFloat(vals[i].value);
          if (desc && !isNaN(val)) {
            itensValidos.push({ desc: desc, valor: val });
          }
        });

        if (itensValidos.length === 0) {
          somErro();
          alert("Por favor, preencha a descrição e o valor de pelo menos 1 serviço.");
          return null;
        }

        return {
          meuNome: document.getElementById("meuNome").value.trim() || "Prestador",
          minhaPix: chavePix,
          tipo: document.getElementById("tipoDoc").value,
          cliente: document.getElementById("clienteNome").value.trim() || "Cliente",
          whats: document.getElementById("clienteWhats").value.replace(/\D/g, ""),
          obs: document.getElementById("observacoes").value.trim(),
          itens: itensValidos,
          total: calcularTotal().toLocaleString("pt-BR", { style: "currency", currency: "BRL" }),
          data: new Date().toLocaleDateString("pt-BR")
        };
      }

      function enviarWhatsApp() {
        const dados = coletarDadosFormulario();
        if (!dados) return;

        somConfirmacao();
        salvarNoHistorico(dados);

        let listaTexto = "";
        dados.itens.forEach((it) => {
          listaTexto += `• ${it.desc}: R$ ${it.valor.toFixed(2).replace(".", ",")}\n`;
        });

        let msg = `📄 *${dados.tipo} DE SERVIÇO*\n\n`;
        msg += `👤 *Cliente:* ${dados.cliente}\n`;
        msg += `🛠️ *Profissional:* ${dados.meuNome}\n`;
        msg += `📅 *Data:* ${dados.data}\n`;
        msg += `─────────────────────────\n`;
        msg += `📋 *ITENS:*\n${listaTexto}`;
        msg += `─────────────────────────\n`;
        msg += `💰 *TOTAL:* ${dados.total}\n\n`;

        if (dados.minhaPix) msg += `🔑 *Chave PIX:* ${dados.minhaPix}\n`;
        if (dados.obs) msg += `📌 *Condições / Observações:*\n${dados.obs}\n`;

        msg += `\n_Emitido via ZapOrçamento • Lodysteelbr_`;

        let tel = dados.whats;
        if (tel && !tel.startsWith("55") && tel.length >= 10) tel = "55" + tel;

        const url = tel 
          ? `https://wa.me/${tel}?text=${encodeURIComponent(msg)}`
          : `https://wa.me/?text=${encodeURIComponent(msg)}`;

        setTimeout(() => window.open(url, "_blank"), 220);
      }

      function imprimirPDF() {
        const dados = coletarDadosFormulario();
        if (!dados) return;

        somConfirmacao();
        salvarNoHistorico(dados);

        const logoSalvo = localStorage.getItem("prestador_logo");

        let linhasTabela = "";
        dados.itens.forEach((it) => {
          linhasTabela += `
            <tr>
              <td style="padding: 10px; border-bottom: 1px solid #e2e8f0;">${it.desc}</td>
              <td style="padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: right;">R$ ${it.valor.toFixed(2).replace(".", ",")}</td>
            </tr>
          `;
        });

        const folha = document.getElementById("folhaImpressao");
        folha.innerHTML = `
          <div class="marca-dagua-impressao">LODYSTEELBR</div>

          <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 2px solid #0f172a; padding-bottom: 15px; margin-bottom: 20px;">
            <div>
              <h1 style="font-size: 24px; margin-bottom: 4px; color: #0f172a;">${dados.tipo}</h1>
              <p style="color: #64748b; font-size: 13px;">Data de Emissão: ${dados.data}</p>
            </div>
            ${logoSalvo ? `<img src="${logoSalvo}" style="max-height: 65px; max-width: 150px; object-fit: contain;" />` : `<h2 style="color: #059669; font-size: 20px;">${dados.meuNome}</h2>`}
          </div>
          
          <div style="margin-bottom: 20px; font-size: 14px; line-height: 1.6;">
            <p><strong>Emissor:</strong> ${dados.meuNome}</p>
            <p><strong>Cliente:</strong> ${dados.cliente}</p>
            ${dados.minhaPix ? `<p><strong>Chave PIX:</strong> ${dados.minhaPix}</p>` : ""}
          </div>

          <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px; position:relative; z-index:1;">
            <thead>
              <tr style="background: #f8fafc;">
                <th style="padding: 10px; text-align: left; border-bottom: 2px solid #334155;">Serviço</th>
                <th style="padding: 10px; text-align: right; border-bottom: 2px solid #334155;">Valor</th>
              </tr>
            </thead>
            <tbody>${linhasTabela}</tbody>
          </table>

          <h2 style="text-align: right; margin-bottom: 15px; color: #059669;">Total: ${dados.total}</h2>
          
          ${dados.obs ? `<div style="margin-top: 15px; padding: 12px; background: #f8fafc; border-left: 4px solid #38bdf8; font-size: 13px;"><p style="white-space: pre-wrap;"><strong>Condições:</strong>\n${dados.obs}</p></div>` : ""}

          <div style="margin-top: 40px; text-align: center; font-size: 11px; color: #94a3b8; border-top: 1px solid #e2e8f0; padding-top: 10px;">
            Documento emitido eletronicamente via ZapOrçamento • Marca Registrada Lodysteelbr
          </div>
        `;

        setTimeout(() => window.print(), 250);
      }
    </script>
  </body>
</html>
