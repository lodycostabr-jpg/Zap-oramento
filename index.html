<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZapOrçamento - Orçamentos e Recibos Rápidos</title>
    <style>
      :root {
        --primary: #059669;
        --primary-hover: #047857;
        --bg: #090d16;
        --card: #131b2e;
        --border: #24324d;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --accent: #38bdf8;
        --success: #10b981;
        --danger: #ef4444;
        --warning: #f59e0b;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      body {
        background-color: var(--bg);
        color: var(--text);
        padding: 16px 12px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
      }

      .container {
        width: 100%;
        max-width: 620px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      header {
        text-align: center;
        margin-bottom: 4px;
      }

      header h1 {
        font-size: 26px;
        color: #34d399;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      header p {
        font-size: 14px;
        color: var(--text-muted);
        margin-top: 4px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        width: 100%;
        overflow: hidden;
      }

      .card h2 {
        font-size: 15px;
        font-weight: 700;
        color: var(--accent);
        border-bottom: 1px solid var(--border);
        padding-bottom: 8px;
        letter-spacing: 0.3px;
      }

      .campo {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 100%;
      }

      label {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
      }

      input, select, textarea {
        background: #090d16;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        color: #fff;
        font-size: 15px;
        outline: none;
        width: 100%;
        min-width: 0;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      input:focus, select:focus, textarea:focus {
        border-color: #34d399;
      }

      /* Classes dinâmicas de validação */
      input.valido {
        border-color: var(--success) !important;
        box-shadow: 0 0 8px rgba(16, 185, 129, 0.2);
      }

      input.invalido {
        border-color: var(--danger) !important;
        box-shadow: 0 0 8px rgba(239, 68, 68, 0.3);
      }

      input.atencao {
        border-color: var(--warning) !important;
      }

      .msg-validacao {
        font-size: 12px;
        font-weight: 600;
        margin-top: 2px;
        display: none;
      }

      .linha-dupla {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        width: 100%;
      }

      /* Itens de Serviço */
      .item-linha {
        display: grid;
        grid-template-columns: minmax(0, 1.8fr) minmax(0, 1.1fr) 42px;
        gap: 8px;
        align-items: center;
        width: 100%;
        margin-bottom: 8px;
      }

      .item-linha input {
        min-width: 0;
      }

      .btn-remover {
        background: #ef4444;
        color: white;
        border: none;
        border-radius: 8px;
        width: 100%;
        height: 44px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
      }

      .btn-remover:active {
        transform: scale(0.94);
        background: #dc2626;
      }

      .btn-adicionar {
        background: #1e293b;
        color: var(--accent);
        border: 1px dashed var(--accent);
        border-radius: 8px;
        padding: 11px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        transition: 0.2s;
      }

      .btn-adicionar:hover {
        background: #24324d;
      }

      .total-box {
        background: #090d16;
        padding: 14px 16px;
        border-radius: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 18px;
        font-weight: bold;
        color: #34d399;
        border: 1px solid #059669;
      }

      /* Assistente de Observações */
      .assistente-box {
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: #0c1220;
        border: 1px dashed #38bdf8;
        border-radius: 10px;
        padding: 12px;
      }

      .assistente-cabecalho {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .assistente-cabecalho span {
        font-size: 13px;
        font-weight: 700;
        color: #38bdf8;
      }

      .chips-container {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .chip-btn {
        background: #1e293b;
        border: 1px solid #334155;
        color: #e2e8f0;
        padding: 6px 10px;
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
        transition: 0.15s;
      }

      .chip-btn:hover {
        border-color: #38bdf8;
        color: #38bdf8;
      }

      .chip-btn:active {
        background: #38bdf8;
        color: #090d16;
      }

      /* Botões de Ação */
      .acoes {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .btn-whats {
        background: #25d366;
        color: #0b141a;
        border: none;
        padding: 15px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 10px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: 0.2s;
      }

      .btn-whats:hover {
        background: #20ba5a;
      }

      .btn-pdf {
        background: var(--accent);
        color: #0f172a;
        border: none;
        padding: 13px;
        font-size: 15px;
        font-weight: bold;
        border-radius: 10px;
        cursor: pointer;
      }

      @media (max-width: 380px) {
        .linha-dupla {
          grid-template-columns: 1fr;
        }
        .item-linha {
          grid-template-columns: 1.6fr 1fr 38px;
          gap: 6px;
        }
      }

      /* Estilos para impressão / PDF */
      @media print {
        body {
          background: white !important;
          color: black !important;
          padding: 0;
        }
        .container {
          max-width: 100%;
        }
        header, .card, .acoes, .btn-adicionar, .btn-remover, .assistente-box {
          display: none !important;
        }
        #folhaImpressao {
          display: block !important;
          color: black;
          padding: 30px;
        }
      }

      #folhaImpressao {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>⚡ ZapOrçamento</h1>
        <p>Crie orçamentos e recibos profissionais em segundos</p>
      </header>

      <!-- 1. Dados do Prestador -->
      <div class="card">
        <h2>1. Meus Dados (Salvos no aparelho)</h2>
        <div class="campo">
          <label>Seu Nome ou Nome do Negócio</label>
          <input type="text" id="meuNome" placeholder="Ex: Silva Manutenções" onchange="salvarMeusDados()" />
        </div>

        <div class="linha-dupla">
          <div class="campo">
            <label>Tipo de Chave PIX</label>
            <select id="tipoPix" onchange="aoMudarTipoPix()">
              <option value="cpf">CPF</option>
              <option value="telefone">Celular</option>
              <option value="email">E-mail</option>
              <option value="aleatoria">Chave Aleatória</option>
            </select>
          </div>
          <div class="campo">
            <label>Tipo de Documento</label>
            <select id="tipoDoc">
              <option value="ORÇAMENTO">Orçamento</option>
              <option value="RECIBO DE PAGAMENTO">Recibo</option>
            </select>
          </div>
        </div>

        <div class="campo">
          <label>Chave PIX</label>
          <input 
            type="text" 
            id="minhaPix" 
            placeholder="Digite os 11 números do CPF" 
            oninput="validarCampoPix()" 
            onchange="salvarMeusDados()" 
          />
          <small id="statusPix" class="msg-validacao"></small>
        </div>
      </div>

      <!-- 2. Dados do Cliente -->
      <div class="card">
        <h2>2. Dados do Cliente</h2>
        <div class="linha-dupla">
          <div class="campo">
            <label>Nome do Cliente</label>
            <input type="text" id="clienteNome" placeholder="Ex: Roberto Carlos" />
          </div>
          <div class="campo">
            <label>WhatsApp (com DDD)</label>
            <input type="tel" id="clienteWhats" placeholder="Ex: 11999998888" />
          </div>
        </div>
      </div>

      <!-- 3. Serviços ou Produtos -->
      <div class="card">
        <h2>3. Serviços ou Produtos</h2>
        <div id="listaItens">
          <div class="item-linha">
            <input type="text" class="item-desc" placeholder="Descrição do serviço" />
            <input type="number" class="item-valor" placeholder="R$ 0,00" oninput="atualizarTotal()" />
            <button class="btn-remover" onclick="removerItem(this)">✕</button>
          </div>
        </div>
        <button class="btn-adicionar" onclick="adicionarItem()">+ Adicionar outro serviço</button>

        <div class="total-box">
          <span>Total Geral:</span>
          <span id="valorTotal">R$ 0,00</span>
        </div>
      </div>

      <!-- 4. Observações / Assistente -->
      <div class="card">
        <h2>4. Condições e Termos</h2>
        <div class="assistente-box">
          <div class="assistente-cabecalho">
            <span>✨ Gerador Rápido de Cláusulas</span>
            <small style="color: #64748b; font-size: 11px;">1-Clique para aplicar</small>
          </div>
          <div class="chips-container">
            <button class="chip-btn" onclick="inserirClausula('padrao')">📅 Padrão (50% entrada / 50% entrega)</button>
            <button class="chip-btn" onclick="inserirClausula('garantia')">🛡️ Garantia de 90 Dias</button>
            <button class="chip-btn" onclick="inserirClausula('materiais')">📦 Materiais à parte</button>
            <button class="chip-btn" onclick="inserirClausula('desconto')">💰 5% desconto à vista</button>
            <button class="chip-btn" onclick="inserirClausula('completo')" style="border-color: #34d399; color: #34d399;">🤖 Proposta Completa</button>
          </div>
        </div>

        <div class="campo">
          <label>Texto Final de Observações</label>
          <textarea id="observacoes" rows="3" placeholder="Clique num botão acima ou digite as condições..."></textarea>
        </div>
      </div>

      <!-- Ações -->
      <div class="acoes">
        <button class="btn-whats" onclick="enviarWhatsApp()">
          📲 Enviar Proposta pelo WhatsApp
        </button>
        <button class="btn-pdf" onclick="imprimirPDF()">
          📄 Salvar em PDF / Imprimir
        </button>
      </div>

      <div id="folhaImpressao"></div>
    </div>

    <script>
      // ==========================================
      // SISTEMA DE ÁUDIO WEB (SEM ARQUIVOS EXTERNOS)
      // ==========================================
      let audioCtx = null;
      function getAudioContext() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }
        return audioCtx;
      }

      // Som agradável de sucesso (acorde harmônico ascendente)
      function somConfirmacao() {
        try {
          const ctx = getAudioContext();
          const now = ctx.currentTime;

          // Nota 1 (Mi / E5 - 659.25Hz)
          const osc1 = ctx.createOscillator();
          const gain1 = ctx.createGain();
          osc1.type = "sine";
          osc1.frequency.setValueAtTime(659.25, now);
          gain1.gain.setValueAtTime(0.15, now);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc1.connect(gain1);
          gain1.connect(ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.15);

          // Nota 2 (Lá / A5 - 880Hz)
          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.type = "sine";
          osc2.frequency.setValueAtTime(880, now + 0.1);
          gain2.gain.setValueAtTime(0.18, now + 0.1);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.start(now + 0.1);
          osc2.stop(now + 0.35);
        } catch (e) {
          console.log("Áudio não disponível", e);
        }
      }

      // Som de alerta/erro (tom grave descendente)
      function somErro() {
        try {
          const ctx = getAudioContext();
          const now = ctx.currentTime;

          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.linearRampToValueAtTime(120, now + 0.22);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.22);
        } catch (e) {
          console.log("Áudio não disponível", e);
        }
      }

      // ==========================================
      // VALIDAÇÃO OFICIAL DE CPF (RECEITA FEDERAL)
      // ==========================================
      function testarValidadeCPF(strCPF) {
        let cpf = strCPF.replace(/\D/g, "");
        if (cpf.length !== 11) return false;
        if (/^(\d)\1{10}$/.test(cpf)) return false; // descarta 11111111111, 22222222222, etc.

        let soma = 0;
        for (let i = 0; i < 9; i++) {
          soma += parseInt(cpf.charAt(i)) * (10 - i);
        }
        let resto = 11 - (soma % 11);
        let dig1 = (resto === 10 || resto === 11) ? 0 : resto;
        if (dig1 !== parseInt(cpf.charAt(9))) return false;

        soma = 0;
        for (let i = 0; i < 10; i++) {
          soma += parseInt(cpf.charAt(i)) * (11 - i);
        }
        resto = 11 - (soma % 11);
        let dig2 = (resto === 10 || resto === 11) ? 0 : resto;
        if (dig2 !== parseInt(cpf.charAt(10))) return false;

        return true;
      }

      function formatarMascaraCPF(v) {
        v = v.replace(/\D/g, "").slice(0, 11);
        if (v.length > 9) return v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, "$1.$2.$3-$4");
        if (v.length > 6) return v.replace(/(\d{3})(\d{3})(\d{1,3})/, "$1.$2.$3");
        if (v.length > 3) return v.replace(/(\d{3})(\d{1,3})/, "$1.$2");
        return v;
      }

      function validarCampoPix() {
        const tipo = document.getElementById("tipoPix").value;
        const input = document.getElementById("minhaPix");
        const status = document.getElementById("statusPix");

        input.classList.remove("valido", "invalido", "atencao");
        status.style.display = "none";

        if (!input.value.trim()) return true;

        if (tipo === "cpf") {
          // Aplica formatação automática com pontos e traço
          const cursor = input.selectionStart;
          input.value = formatarMascaraCPF(input.value);

          const apenasNums = input.value.replace(/\D/g, "");

          if (apenasNums.length === 11) {
            if (testarValidadeCPF(apenasNums)) {
              input.classList.add("valido");
              status.innerText = "✅ CPF válido";
              status.style.color = "var(--success)";
              status.style.display = "block";
              return true;
            } else {
              input.classList.add("invalido");
              status.innerText = "❌ CPF inválido! Verifique os números digitados.";
              status.style.color = "var(--danger)";
              status.style.display = "block";
              return false;
            }
          } else {
            input.classList.add("atencao");
            status.innerText = `⏳ Digitando CPF... (${apenasNums.length}/11 números)`;
            status.style.color = "var(--warning)";
            status.style.display = "block";
            return false;
          }
        }

        return true;
      }

      function aoMudarTipoPix() {
        const tipo = document.getElementById("tipoPix").value;
        const input = document.getElementById("minhaPix");
        input.value = "";
        input.classList.remove("valido", "invalido", "atencao");
        document.getElementById("statusPix").style.display = "none";

        if (tipo === "cpf") input.placeholder = "000.000.000-00";
        else if (tipo === "telefone") input.placeholder = "(11) 99999-9999";
        else if (tipo === "email") input.placeholder = "seuemail@exemplo.com";
        else input.placeholder = "Cole a chave aleatória";

        salvarMeusDados();
      }

      // ==========================================
      // PERSISTÊNCIA LOCAL (localStorage)
      // ==========================================
      window.onload = function () {
        const nomeSalvo = localStorage.getItem("prestador_nome");
        const pixSalva = localStorage.getItem("prestador_pix");
        const tipoPixSalvo = localStorage.getItem("prestador_tipo_pix");

        if (nomeSalvo) document.getElementById("meuNome").value = nomeSalvo;
        if (tipoPixSalvo) document.getElementById("tipoPix").value = tipoPixSalvo;
        if (pixSalva) {
          document.getElementById("minhaPix").value = pixSalva;
          validarCampoPix();
        }
      };

      function salvarMeusDados() {
        localStorage.setItem("prestador_nome", document.getElementById("meuNome").value);
        localStorage.setItem("prestador_pix", document.getElementById("minhaPix").value);
        localStorage.setItem("prestador_tipo_pix", document.getElementById("tipoPix").value);
      }

      // ==========================================
      // GESTÃO DE ITENS E CÁLCULO
      // ==========================================
      function adicionarItem() {
        const lista = document.getElementById("listaItens");
        const div = document.createElement("div");
        div.className = "item-linha";
        div.innerHTML = `
          <input type="text" class="item-desc" placeholder="Descrição do serviço" />
          <input type="number" class="item-valor" placeholder="R$ 0,00" oninput="atualizarTotal()" />
          <button class="btn-remover" onclick="removerItem(this)">✕</button>
        `;
        lista.appendChild(div);
      }

      function removerItem(btn) {
        const itens = document.querySelectorAll(".item-linha");
        if (itens.length > 1) {
          btn.parentElement.remove();
          atualizarTotal();
        } else {
          somErro();
          alert("O documento precisa de pelo menos um serviço.");
        }
      }

      function calcularTotal() {
        const valores = document.querySelectorAll(".item-valor");
        let soma = 0;
        valores.forEach((input) => {
          const val = parseFloat(input.value);
          if (!isNaN(val)) soma += val;
        });
        return soma;
      }

      function atualizarTotal() {
        const total = calcularTotal();
        document.getElementById("valorTotal").innerText = total.toLocaleString("pt-BR", {
          style: "currency",
          currency: "BRL"
        });
      }

      // ==========================================
      // ASSISTENTE DE TEXTO / CLÁUSULAS
      // ==========================================
      function inserirClausula(tipo) {
        const campoObs = document.getElementById("observacoes");
        let textoAtual = campoObs.value.trim();

        const clausulas = {
          padrao: "Proposta válida por 7 dias. Pagamento: 50% de entrada e 50% na conclusão dos trabalhos.",
          garantia: "Garantia legal de 90 dias sobre a mão de obra prestada, mediante apresentação desta proposta.",
          materiais: "Valores referentes apenas à execução da mão de obra. Materiais extras ficam por conta do cliente.",
          desconto: "Pagamento integral à vista no PIX conta com 5% de desconto promocional."
        };

        if (tipo === "completo") {
          const tipoDoc = document.getElementById("tipoDoc").value;
          if (tipoDoc === "RECIBO DE PAGAMENTO") {
            campoObs.value = "Declaro que o valor acima foi recebido e quitado integralmente. Garantia de 90 dias sobre os serviços executados.";
          } else {
            campoObs.value = "Validade desta proposta: 7 dias corridos.\nCondições: 50% de entrada e 50% na entrega.\nGarantia de 90 dias sobre a mão de obra.\nMateriais necessários não inclusos.";
          }
          somConfirmacao();
          return;
        }

        if (textoAtual.length > 0) {
          campoObs.value = textoAtual + "\n" + clausulas[tipo];
        } else {
          campoObs.value = clausulas[tipo];
        }
        somConfirmacao();
      }

      // ==========================================
      // AÇÕES (WHATSAPP E PDF)
      // ==========================================
      function validarAntesDeEnviar() {
        const tipoPix = document.getElementById("tipoPix").value;
        const chavePix = document.getElementById("minhaPix").value.trim();

        // Se o tipo for CPF e estiver preenchido com erro
        if (tipoPix === "cpf" && chavePix.length > 0) {
          const cpfLimpo = chavePix.replace(/\D/g, "");
          if (cpfLimpo.length !== 11 || !testarValidadeCPF(cpfLimpo)) {
            somErro();
            document.getElementById("minhaPix").focus();
            alert("⚠️ Atenção: O CPF informado na Chave PIX é inválido. Corrija antes de gerar o documento!");
            return false;
          }
        }

        // Verifica itens
        const descs = document.querySelectorAll(".item-desc");
        const vals = document.querySelectorAll(".item-valor");
        let temItemValido = false;

        descs.forEach((d, i) => {
          if (d.value.trim() && !isNaN(parseFloat(vals[i].value))) {
            temItemValido = true;
          }
        });

        if (!temItemValido) {
          somErro();
          alert("Por favor, preencha ao menos a descrição e o valor de 1 serviço.");
          return false;
        }

        return true;
      }

      function enviarWhatsApp() {
        if (!validarAntesDeEnviar()) return;

        // Toca som de confirmação imediato
        somConfirmacao();

        const meuNome = document.getElementById("meuNome").value.trim() || "Prestador";
        const minhaPix = document.getElementById("minhaPix").value.trim();
        const tipo = document.getElementById("tipoDoc").value;
        const cliente = document.getElementById("clienteNome").value.trim() || "Cliente";
        let whats = document.getElementById("clienteWhats").value.replace(/\D/g, "");
        const obs = document.getElementById("observacoes").value.trim();

        const descs = document.querySelectorAll(".item-desc");
        const vals = document.querySelectorAll(".item-valor");

        let listaTexto = "";
        descs.forEach((d, i) => {
          const descTexto = d.value.trim();
          const valorNum = parseFloat(vals[i].value);
          if (descTexto && !isNaN(valorNum)) {
            listaTexto += `• ${descTexto}: R$ ${valorNum.toFixed(2).replace(".", ",")}\n`;
          }
        });

        const totalFormatado = calcularTotal().toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
        const dataHoje = new Date().toLocaleDateString("pt-BR");

        let msg = `📄 *${tipo} DE SERVIÇO*\n\n`;
        msg += `👤 *Cliente:* ${cliente}\n`;
        msg += `🛠️ *Profissional:* ${meuNome}\n`;
        msg += `📅 *Data:* ${dataHoje}\n`;
        msg += `─────────────────────────\n`;
        msg += `📋 *ITENS:*\n${listaTexto}`;
        msg += `─────────────────────────\n`;
        msg += `💰 *TOTAL:* ${totalFormatado}\n\n`;

        if (minhaPix) msg += `🔑 *Chave PIX:* ${minhaPix}\n`;
        if (obs) msg += `📌 *Condições / Observações:*\n${obs}\n`;

        msg += `\n_Emitido via ZapOrçamento_`;

        if (whats && !whats.startsWith("55") && whats.length >= 10) {
          whats = "55" + whats;
        }

        const url = whats 
          ? `https://wa.me/${whats}?text=${encodeURIComponent(msg)}`
          : `https://wa.me/?text=${encodeURIComponent(msg)}`;

        // Abre após 220ms para o som tocar com nitidez
        setTimeout(() => {
          window.open(url, "_blank");
        }, 220);
      }

      function imprimirPDF() {
        if (!validarAntesDeEnviar()) return;

        // Toca som de confirmação imediato
        somConfirmacao();

        const meuNome = document.getElementById("meuNome").value || "Prestador";
        const minhaPix = document.getElementById("minhaPix").value;
        const tipo = document.getElementById("tipoDoc").value;
        const cliente = document.getElementById("clienteNome").value || "Cliente";
        const obs = document.getElementById("observacoes").value;
        const total = calcularTotal().toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

        const descs = document.querySelectorAll(".item-desc");
        const vals = document.querySelectorAll(".item-valor");

        let linhasTabela = "";
        descs.forEach((d, i) => {
          const desc = d.value.trim();
          const val = parseFloat(vals[i].value);
          if (desc && !isNaN(val)) {
            linhasTabela += `
              <tr>
                <td style="padding: 10px; border-bottom: 1px solid #e2e8f0;">${desc}</td>
                <td style="padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: right;">R$ ${val.toFixed(2).replace(".", ",")}</td>
              </tr>
            `;
          }
        });

        const folha = document.getElementById("folhaImpressao");
        folha.innerHTML = `
          <h1 style="text-align: center; font-size: 24px; margin-bottom: 4px;">${tipo}</h1>
          <p style="text-align: center; color: #64748b; margin-bottom: 24px;">Data: ${new Date().toLocaleDateString("pt-BR")}</p>
          
          <div style="margin-bottom: 20px; font-size: 15px; line-height: 1.6;">
            <p><strong>Profissional:</strong> ${meuNome}</p>
            <p><strong>Cliente:</strong> ${cliente}</p>
            ${minhaPix ? `<p><strong>Chave PIX:</strong> ${minhaPix}</p>` : ""}
          </div>

          <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
            <thead>
              <tr style="background: #f8fafc;">
                <th style="padding: 10px; text-align: left; border-bottom: 2px solid #334155;">Serviço</th>
                <th style="padding: 10px; text-align: right; border-bottom: 2px solid #334155;">Valor</th>
              </tr>
            </thead>
            <tbody>${linhasTabela}</tbody>
          </table>

          <h2 style="text-align: right; margin-bottom: 15px; color: #059669;">Total: ${total}</h2>
          ${obs ? `<div style="margin-top: 20px; padding: 12px; background: #f8fafc; border-left: 4px solid #38bdf8; font-size: 13px;"><p style="white-space: pre-wrap;"><strong>Condições:</strong>\n${obs}</p></div>` : ""}
        `;

        // Aciona o diálogo de impressão após 250ms
        setTimeout(() => {
          window.print();
        }, 250);
      }
    </script>
  </body>
</html>
